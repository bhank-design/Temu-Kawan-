<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff6b35">
<meta name="author" content="Shank Anggara From Ulumonggo">
<meta name="copyright" content="© 2025 Shank Anggara From Ulumonggo">
<title>Temu Kawan Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p1:#ff6b35;--p2:#f7931e;--p3:#a855f7;--bg:#fff8f0;--card:#fff;--txt:#1e293b;--muted:#94a3b8;--border:#f0e6dc;--ok:#10b981;--err:#ef4444;--verify:#ff8c00;--grad:linear-gradient(135deg,#ff6b35,#f7931e,#a855f7);--shadow:0 4px 20px rgba(255,107,53,.1)}
body.dark{--bg:#0f172a;--card:#1e293b;--txt:#f1f5f9;--muted:#94a3b8;--border:#334155;--shadow:0 4px 20px rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:100px;overflow-x:hidden;transition:background .3s,color .3s}
#app{max-width:560px;margin:0 auto;padding:12px}
input,textarea,button{font-family:inherit;outline:none;border:none;background:none;color:inherit}
button{cursor:pointer;transition:transform .12s,opacity .15s}
button:active{transform:scale(.96)}
.header{background:var(--card);border-radius:20px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:14px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:20;transition:background .3s}
.logo{font-size:22px;font-weight:900;flex:1;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.logo-sub{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:-4px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;border:2.5px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);background:var(--grad);color:#fff;font-weight:700;position:relative;transition:transform .15s;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:34px;height:34px;font-size:17px}
.avatar.xs{width:26px;height:26px;font-size:13px;border-width:2px}
.avatar.lg{width:88px;height:88px;font-size:44px;border-width:4px}
.avatar.online::after{content:'';position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2.5px solid var(--card);z-index:2}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,107,53,.1);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;flex-shrink:0;color:var(--p1)}
body.dark .icon-btn{background:rgba(255,107,53,.15)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--err);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--card)}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom));transition:background .3s}
.bottomnav .inner{max-width:560px;margin:0 auto;display:flex;position:relative}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--muted);font-size:10px;font-weight:700;position:relative}
.navbtn .ic{font-size:22px;line-height:1;transition:transform .2s}
.navbtn.active{color:var(--p1)}
.navbtn.active .ic{transform:translateY(-2px)}
.navbtn.create{flex:0 0 64px}
.navbtn.create .ic{width:46px;height:46px;background:var(--grad);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;margin-top:-14px;box-shadow:0 6px 18px rgba(255,107,53,.4);border:3px solid var(--card)}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--grad)}
.auth-card{background:var(--card);border-radius:28px;padding:34px 26px;max-width:420px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.25);text-align:center}
.auth-logo{font-size:38px;font-weight:900;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1.5px}
.auth-tag{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.auth-by{font-size:11px;color:var(--muted);margin-bottom:20px;padding:7px;background:linear-gradient(135deg,rgba(255,107,53,.08),rgba(168,85,247,.08));border-radius:10px;font-weight:600}
.auth-by b{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.field{width:100%;padding:14px 18px;background:rgba(255,107,53,.05);border:2px solid var(--border);border-radius:16px;font-size:15px;margin-bottom:12px;transition:border .15s,background .15s;color:var(--txt)}
.field:focus{border-color:var(--p1);background:var(--card)}
.field-wrap{position:relative;margin-bottom:12px}
.field-wrap .field{margin-bottom:0;padding-right:50px}
.field-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);cursor:pointer}
.emoji-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:18px}
.emoji-pick button{font-size:20px;background:rgba(255,107,53,.05);border:2px solid transparent;border-radius:11px;padding:6px;transition:all .12s}
.emoji-pick button.sel{border-color:var(--p1);background:rgba(255,107,53,.15);transform:scale(1.08)}
.btn{width:100%;padding:14px;background:var(--grad);color:#fff;border-radius:16px;font-weight:800;font-size:15px;letter-spacing:.3px;box-shadow:0 8px 20px rgba(255,107,53,.35)}
.btn:disabled{opacity:.5;box-shadow:none}
.btn.sec{background:rgba(255,107,53,.1);color:var(--txt);box-shadow:none}
.link{color:var(--p1);font-weight:700;cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);animation:fadeIn .3s ease-out;transition:background .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ct{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.ct:hover{transform:translateY(-1px)}
.ct .fake{flex:1;background:rgba(255,107,53,.07);border-radius:22px;padding:11px 16px;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:14px;font-weight:700;font-size:13px;background:rgba(255,107,53,.08);color:var(--muted);transition:all .15s}
.tab.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(255,107,53,.3)}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-head .info{flex:1;min-width:0}
.post-head .name{font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.post-head .time{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.post-text{font-size:14.5px;line-height:1.55;margin-bottom:10px;word-wrap:break-word;white-space:pre-wrap}
.post-img{width:100%;border-radius:14px;margin-bottom:10px;display:block;max-height:480px;object-fit:cover;background:rgba(255,107,53,.05);cursor:pointer}
.post-actions{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--border)}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted);transition:all .15s}
.act:hover{background:rgba(255,107,53,.05)}
.act.liked{color:var(--p1)}
.act.liked span:first-child{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.4)}}
.comments{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.comments.open{display:block}
.cmt{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.cmt .body{background:rgba(255,107,53,.06);border-radius:14px;padding:8px 12px;flex:1}
.cmt .body b{display:block;font-size:12px;color:var(--p1);margin-bottom:2px}
.cmt-input{display:flex;gap:8px;margin-top:8px}
.cmt-input input{flex:1;background:rgba(255,107,53,.07);border-radius:20px;padding:10px 16px;font-size:13px;color:var(--txt)}
.cmt-input button{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;font-size:16px;flex-shrink:0}
.empty{text-align:center;padding:50px 24px;color:var(--muted)}
.empty .big{font-size:56px;margin-bottom:12px;opacity:.5}
.empty h4{font-size:15px;font-weight:800;color:var(--txt);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5}
.user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:16px;margin-bottom:8px;box-shadow:0 2px 8px rgba(255,107,53,.05);cursor:pointer;transition:transform .15s}
.user-row:hover{transform:translateX(2px)}
.user-row .info{flex:1;min-width:0}
.user-row .name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.user-row .bio{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini-btn{padding:7px 16px;border-radius:16px;font-weight:800;font-size:12px;background:var(--grad);color:#fff;flex-shrink:0}
.mini-btn.following{background:rgba(255,107,53,.1);color:var(--txt)}
.mini-btn.following:hover{background:rgba(239,68,68,.15);color:var(--err)}
.verify-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--verify);color:#fff;font-size:10px;font-weight:900;margin-left:3px;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,140,0,.2)}
.verify-icon.founder{background:linear-gradient(135deg,#ff6b35,#f7931e);box-shadow:0 0 0 2px rgba(255,107,53,.3);width:17px;height:17px;font-size:11px}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-radius:20px;margin-bottom:12px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:20}
.chat-header .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chat-header .sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.chat-header .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chat-header .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.back-btn{font-size:22px;padding:4px 8px;color:var(--txt);font-weight:300}
.chat-body{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-height:420px;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.chat-body::-webkit-scrollbar{width:4px}
.chat-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bubble{max-width:78%;padding:10px 14px;border-radius:20px;font-size:14px;line-height:1.4;word-wrap:break-word;animation:fadeIn .2s;position:relative}
.bubble.me{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bubble.them{background:rgba(255,107,53,.08);color:var(--txt);align-self:flex-start;border-bottom-left-radius:6px}
.bubble .t{font-size:10px;opacity:.65;margin-top:4px;display:block;text-align:right}
.bubble .seen{font-size:10px;opacity:.9;margin-left:4px}
.bubble img,.bubble audio{max-width:100%;border-radius:12px;display:block;margin-bottom:4px}
.bubble audio{width:220px}
.chat-input-row{display:flex;gap:8px;margin-top:12px;padding:6px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);align-items:center}
.chat-input-row input{flex:1;padding:12px 16px;font-size:14px;background:transparent;color:var(--txt)}
.chat-input-row .sm-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,107,53,.1);font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-input-row .sm-btn.rec{background:var(--err);color:#fff;animation:recPulse 1s infinite}
@keyframes recPulse{50%{transform:scale(1.1)}}
.chat-input-row .send{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;font-size:18px;flex-shrink:0;box-shadow:0 4px 12px rgba(255,107,53,.35)}
.chat-badge{display:inline-block;background:var(--err);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px;margin-left:6px}
.profile-hero{background:var(--grad);border-radius:24px;padding:24px;margin-bottom:14px;text-align:center;color:#fff;position:relative;overflow:hidden}
.profile-hero::before{content:'';position:absolute;top:-50%;left:-20%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%);animation:shine 8s linear infinite}
@keyframes shine{to{transform:rotate(360deg)}}
.profile-hero .avatar{margin:0 auto 12px;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.2);backdrop-filter:blur(10px);position:relative;z-index:1}
.profile-hero .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.profile-hero .pname{font-size:22px;font-weight:900;margin-bottom:4px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.profile-hero .pbio{font-size:13px;opacity:.9;margin-bottom:18px;position:relative;z-index:1}
.stats{display:flex;justify-content:space-around;position:relative;z-index:1}
.stat{cursor:pointer;padding:4px 12px;border-radius:12px;transition:background .15s}
.stat:hover{background:rgba(255,255,255,.15)}
.stat .n{font-size:20px;font-weight:900}
.stat .l{font-size:11px;opacity:.85;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:24px;padding:24px;max-width:440px;width:100%;margin:auto;animation:slideUp .25s;max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin-bottom:16px;font-size:18px;text-align:center;font-weight:800}
.modal label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.img-prev{position:relative;margin-bottom:12px;display:none}
.img-prev.show{display:block}
.img-prev img{width:100%;border-radius:14px;max-height:280px;object-fit:cover}
.img-prev button{position:absolute;top:8px;right:8px;width:30px;height:30px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;font-size:14px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--card);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:8px 4px;display:flex;align-items:center;gap:6px}
.section-title .num{background:var(--p1);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px}
.notif{display:flex;gap:10px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(255,107,53,.05);cursor:pointer;transition:transform .15s;border-left:3px solid transparent}
.notif.unread{border-left-color:var(--p1);background:rgba(255,107,53,.04)}
.notif .body{flex:1;font-size:13px;line-height:1.5}
.notif .body b{color:var(--p1)}
.notif .t{font-size:11px;color:var(--muted);margin-top:3px}
.stories{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px;margin-bottom:8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-item{flex-shrink:0;text-align:center;cursor:pointer;width:68px}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff6b35,#f7931e,#a855f7);display:flex;align-items:center;justify-content:center;position:relative}
.story-ring.seen{background:var(--border)}
.story-ring .avatar{width:100%;height:100%;font-size:26px;border:none;box-shadow:none;background:var(--card);color:var(--txt)}
.story-ring .plus{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;background:var(--grad);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;border:2.5px solid var(--card)}
.story-item .lbl{font-size:11px;color:var(--txt);font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-item{background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(255,107,53,.05);cursor:pointer}
.group-item .gic{width:48px;height:48px;border-radius:16px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.group-item .info{flex:1;min-width:0}
.group-item .name{font-weight:800;font-size:14px}
.group-item .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-stat{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(255,107,53,.05)}
.admin-stat .n{font-size:26px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.admin-stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:700}
.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.footer-copy{text-align:center;padding:14px;margin-top:20px;margin-bottom:70px;font-size:11px;color:var(--muted);line-height:1.7}
.footer-copy b{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.verify-banner{background:linear-gradient(135deg,rgba(255,140,0,.12),rgba(168,85,247,.12));border:2px solid var(--verify);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.verify-banner .ic{font-size:28px;flex-shrink:0}
.verify-banner .txt{flex:1;font-size:12px;line-height:1.5}
.verify-banner .txt b{color:var(--verify)}
.verify-banner button{background:var(--verify);color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:12px;flex-shrink:0}
.verified-badge{background:linear-gradient(135deg,#ff8c00,#ff6b35);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(255,140,0,.3)}
.verified-badge::before{content:'✓';font-size:12px;font-weight:900}
.sk-box{background:rgba(255,107,53,.06);border-radius:12px;padding:12px;font-size:12px;line-height:1.7;color:var(--txt);margin-bottom:12px;max-height:180px;overflow-y:auto}
.sk-box b{color:var(--p1);display:block;margin-bottom:6px}
.profile-pic-picker{display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:16px}
.profile-pic-picker .avatar{width:88px;height:88px;font-size:44px;border-width:4px;cursor:pointer;position:relative}
.profile-pic-picker .avatar::after{content:'📷';position:absolute;bottom:-2px;right:-2px;width:30px;height:30px;background:var(--p1);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid var(--card)}
.setting-list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.setting-item{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.setting-item:last-child{border-bottom:none}
.setting-item:hover{background:rgba(255,107,53,.04)}
.setting-item .sic{font-size:22px;flex-shrink:0;width:28px;text-align:center}
.setting-item .stxt{flex:1}
.setting-item .sttl{font-weight:700;font-size:14px;color:var(--txt)}
.setting-item .ssub{font-size:11px;color:var(--muted);margin-top:2px}
.setting-item .sarr{color:var(--muted);font-size:18px;font-weight:300}
.setting-item.danger .sttl{color:var(--err)}
.setting-item.danger:hover{background:rgba(239,68,68,.06)}
.setting-section{margin-bottom:6px}

let state = null;

/* ---------- REALTIME ---------- */
let channel;
try { channel = new BroadcastChannel('temu_kawan_pro_sync'); } catch(e) { channel = null; }
if (channel) {
  channel.onmessage = (e) => {
    if (e.data.from === TAB_ID) return;
    state = loadState();
    if (view.screen === 'chatroom') renderChatRoom($('pageBody'));

    else if (['feed','chat','notif','groups','admin','verifikasi','pengaturan'].includes(view.screen)) render();
  };
}
function broadcast(type) {
  if (channel) { try { channel.postMessage({ type, from: TAB_ID, at: Date.now() }); } catch(e){} }
  try { localStorage.setItem('_tkp_ping', TAB_ID + ':' + Date.now()); } catch(e){}
}

/* ---------- STORAGE ---------- */
const STORE_KEY = 'temu_kawan_pro_v1';
const SESSION_KEY = 'tkp_session_main';
const AUTO_LOGIN_KEY = 'tkp_autologin';

function defaultState() {
  return { v:1, users:{}, posts:[], chats:{}, groups:{}, notifications:{}, stories:{}, verifikasi:[], seeded:false, theme:'light', blocked:[] };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d.v === 1) return d; }
  } catch(e){}
  return defaultState();
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e) { toast('⚠️ Storage penuh'); }
}
const getMeId = () => localStorage.getItem(AUTO_LOGIN_KEY);
const setMeId = id => id ? localStorage.setItem(AUTO_LOGIN_KEY, id) : localStorage.removeItem(AUTO_LOGIN_KEY);
const me = () => state.users[getMeId()];
const user = id => state.users[id];

/* ---------- HELPERS ---------- */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function timeAgo(t) {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 5) return 'baru saja';
  if (s < 60) return s + ' dtk';
  if (s < 3600) return Math.floor(s/60) + ' mnt';
  if (s < 86400) return Math.floor(s/3600) + ' jam';
  if (s < 604800) return Math.floor(s/86400) + ' hr';
  return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}
function timeFull(t){ return new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function isOnline(id){
  const u = state.users[id]; if (!u) return false;
  if (u.isBot) return true;
  return Date.now() - (u.lastSeen || 0) < 45000;
}
function chatKey(a,b){ return [a,b].sort().join('__'); }
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function playSound(){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 700; o.type='sine';
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    o.start(); o.stop(ctx.currentTime + 0.15);
  } catch(e){}
}
function resizeImg(file, maxW = 720, q = 0.72){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = img.width * sc; c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = e.target.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- AVATAR ---------- */
function avatarHtml(u, extraClass = '') {
  if (!u) return `<div class="avatar ${extraClass}">❓</div>`;
  if (u.avatarPic) return `<div class="avatar ${extraClass}"><img src="${u.avatarPic}" alt="${esc(u.name)}"></div>`;
  return `<div class="avatar ${extraClass}">${u.avatar||'👤'}</div>`;
}
function nameWithBadge(u) {
  if (!u) return '?';
  let badge = '';
  if (u.isFounder) badge = '<span class="verify-icon founder" title="Founder">✓</span>';
  else if (u.verified) badge = '<span class="verify-icon" title="Terverifikasi">✓</span>';
  return esc(u.name) + badge;
}

/* ---------- THEME ---------- */
function applyTheme(){
  document.body.classList.toggle('dark', state.theme === 'dark');
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  saveState(); applyTheme();
  toast(state.theme === 'dark' ? '🌙 Mode Gelap' : '☀️ Mode Terang');
}

/* ---------- SEED ---------- */
function seed(){
  if (state.seeded) return;
  state.seeded = true;
  state.users[FOUNDER.id] = {
    id: FOUNDER.id, username: FOUNDER.username, name: FOUNDER.name,
    email: 'founder@temukawan.app', avatar: FOUNDER.avatar, avatarPic: null,
    bio: FOUNDER.bio, password: FOUNDER.password,
    isBot: false, isAdmin: true, isFounder: true, verified: true,
    following: [], followers: [], joinedAt: Date.now(), lastSeen: Date.now(),
    pin: null
  };
  BOT_DATA.forEach((b, i) => {
    const id = 'bot' + i;
    state.users[id] = {
      id, name:b.name, email:b.email, avatar:b.avatar, avatarPic:null, bio:b.bio,
      isBot:true, verified: i < 3, following:[], followers:[],
      joinedAt: Date.now() - (i+1)*86400000, lastSeen:Date.now()
    };
  });
  BOT_DATA.forEach((_, i) => {
    for (let j = 0; j < BOT_DATA.length; j++) {
      if (j !== i && Math.random() < 0.55) {
        state.users['bot'+i].following.push('bot'+j);
        state.users['bot'+j].followers.push('bot'+i);
      }
    }
  });
  BOT_DATA.forEach((b, i) => {
    state.posts.push({
      id: uid('p'), authorId:'bot'+i, text:b.post, image:null,
      likes:[], comments:[], time: Date.now() - (i+1)*1800000
    });
  });
  saveState();
}

/* ---------- NOTIF ---------- */
function pushNotif(userId, type, data){
  if (!state.notifications[userId]) state.notifications[userId] = [];
  state.notifications[userId].unshift({ id: uid('n'), type, ...data, time: Date.now(), read: false });
  if (state.notifications[userId].length > 60)
    state.notifications[userId] = state.notifications[userId].slice(0, 60);
}
const unreadNotifs = id => (state.notifications[id] || []).filter(n => !n.read).length;

/* ============================================================
   AUTH
============================================================ */
function renderAuth(){
  let picked = '😀';
  let mode = 'login';
  const app = $('app');
  app.innerHTML = `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo">Temu Kawan</div>
    <div class="auth-tag">Menyapa Bebual Bersama ✨</div>
    <div class="auth-by">By <b>Shank Anggara From Ulumonggo</b></div>
    <div id="authForm"></div>
  </div></div>`;
  drawForm();

  function drawForm(){
    const f = $('authForm');
    if (mode === 'login') {
      f.innerHTML = `
        <input class="field" id="aUser" placeholder="Username atau Email" autocomplete="off">
        <div class="field-wrap">
          <input class="field" id="aPass" type="password" placeholder="Password">
          <button class="field-eye" id="eyePass" type="button">👁️</button>
        </div>
        <button class="btn" id="aBtn">Masuk 🚀</button>
        <p style="margin-top:14px;font-size:13px;color:var(--muted);">
          <span class="link" id="goForgot">🔑 Lupa Password?</span>
        </p>
        <p style="margin-top:14px;font-size:13px;color:var(--muted);">
          Belum punya akun? <span class="link" id="goReg">Daftar</span>
        </p>`;
      $('eyePass').onclick = () => {
        const p = $('aPass');
        if (p.type === 'password') { p.type = 'text'; $('eyePass').textContent = '🙈'; }
        else { p.type = 'password'; $('eyePass').textContent = '👁️'; }
      };
      $('aBtn').onclick = () => {
        const key = $('aUser').value.trim();
        const pass = $('aPass').value;
        if (!key || !pass) return toast('Isi username & password');
        // MASTER LOGIN FOUNDER
        if ((key.toLowerCase() === FOUNDER.username || key.toLowerCase() === FOUNDER.name.toLowerCase()) && pass === FOUNDER.password) {
          setMeId(FOUNDER.id);
          enterApp(FOUNDER.name);
          toast('👑 Selamat datang, Founder!');
          return;
        }
        const found = Object.values(state.users).find(u =>
          u.id !== FOUNDER.id && !u.isBot && (
            u.username?.toLowerCase() === key.toLowerCase() ||
            u.email?.toLowerCase() === key.toLowerCase() ||
            u.id === key ||
            u.name.toLowerCase() === key.toLowerCase()
          )
        );
        if (!found) return toast('Akun tidak ditemukan');
        if (found.password !== pass) return toast('Password salah');
        setMeId(found.id); enterApp(found.name);
      };
      $('goReg').onclick = () => { mode = 'register'; drawForm(); };
      $('goForgot').onclick = () => { mode = 'forgot'; drawForm(); };
    }
    else if (mode === 'forgot') {
      f.innerHTML = `
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;text-align:left;line-height:1.6;">
          Masukkan <b>Username</b> atau <b>Email</b> akun Anda, dan <b>Email</b> untuk verifikasi.
        </p>
        <input class="field" id="fUser" placeholder="Username atau Email" autocomplete="off">
        <input class="field" id="fEmail" placeholder="Email yang terdaftar">
        <button class="btn" id="fBtn">🔍 Cari Akun</button>
        <p style="margin-top:14px;font-size:13px;color:var(--muted);">
          Ingat password? <span class="link" id="goLog">Kembali Masuk</span>
        </p>
        <div id="fResult" style="margin-top:18px;"></div>`;
      $('goLog').onclick = () => { mode = 'login'; drawForm(); };
      $('fBtn').onclick = () => {
        const key = $('fUser').value.trim().toLowerCase();
        const email = $('fEmail').value.trim().toLowerCase();
        const res = $('fResult');
        if (!key || !email) { res.innerHTML = '<p style="color:var(--err);font-size:13px;">⚠️ Isi username & email!</p>'; return; }
        if (key === FOUNDER.username || key === FOUNDER.name.toLowerCase()) {
          res.innerHTML = `<p style="color:var(--err);font-size:13px;line-height:1.6;">⚠️ Akun Founder tidak bisa direset di sini.<br>Hubungi support.</p>`;
          return;
        }
        const found = Object.values(state.users).find(u =>
          !u.isBot && u.id !== FOUNDER.id && (
            u.id.toLowerCase() === key || u.username?.toLowerCase() === key ||
            u.name.toLowerCase() === key || u.email?.toLowerCase() === key
          ) && u.email?.toLowerCase() === email
        );
        if (!found) { res.innerHTML = `<p style="color:var(--err);font-size:13px;line-height:1.6;">❌ Akun tidak ditemukan.<br>Pastikan username & email <b>sama persis</b>.</p>`; return; }
        res.innerHTML = `
          <div style="background:rgba(16,185,129,.1);border:2px solid var(--ok);border-radius:14px;padding:14px;text-align:left;">
            <p style="font-size:12px;color:var(--ok);font-weight:800;margin-bottom:10px;">✅ Akun ditemukan: <b>${esc(found.name)}</b></p>
            <div class="field-wrap"><input class="field" id="fNew1" type="password" placeholder="Password baru (min 4)"><button class="field-eye" onclick="toggleEye('fNew1',this)">👁️</button></div>
            <div class="field-wrap"><input class="field" id="fNew2" type="password" placeholder="Ulangi password"><button class="field-eye" onclick="toggleEye('fNew2',this)">👁️</button></div>
            <button class="btn" id="fReset" style="background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 20px rgba(16,185,129,.35);">✅ Reset Password</button>
          </div>`;
        $('fReset').onclick = () => {
          const p1 = $('fNew1').value;
          const p2 = $('fNew2').value;
          if (!p1 || p1.length < 4) return toast('⚠️ Password min 4 karakter');
          if (p1 !== p2) return toast('⚠️ Password tidak sama!');
          found.password = p1;
          saveState(); broadcast('user');
          toast('🎉 Password berhasil direset!');
          setTimeout(() => { mode = 'login'; drawForm(); }, 1200);
        };
      };
    }
    else {
      f.innerHTML = `
        <input class="field" id="aUser" placeholder="Username (unik, tanpa spasi)" maxlength="20">
        <input class="field" id="aName" placeholder="Nama tampilan" maxlength="24">
        <input class="field" id="aEmail" type="email" placeholder="Email" maxlength="60">

        <input class="field" id="aBio" placeholder="Bio singkat (opsional)" maxlength="80">
        <label style="font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;text-align:left;margin-bottom:8px;">Pilih avatar</label>

        const username = $('aUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
        const name = $('aName').value.trim();
        const email = $('aEmail').value.trim().toLowerCase();
        const pass = $('aPass').value;
        const bio = $('aBio').value.trim();
        if (!username || username.length < 3) return toast('Username min 3 karakter');
        if (username === FOUNDER.username) return toast('Username tidak bisa dipakai');
        if (!name) return toast('Isi nama tampilan');
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Email tidak valid');
        if (!pass || pass.length < 4) return toast('Password min 4 karakter');
        if (state.users['u_'+username]) return toast('Username sudah dipakai');
        if (Object.values(state.users).some(u => u.email?.toLowerCase() === email)) return toast('Email sudah terdaftar');
        const id = 'u_' + username;
        state.users[id] = {
          id, username, name, email, avatar: picked, avatarPic: null,
          bio: bio || 'Hai! Saya pengguna baru Temu Kawan 👋',
          password: pass, isBot: false, isAdmin: false,
          isFounder: false, verified: false,
          following: ['bot0','bot1'], followers: [],
          joinedAt: Date.now(), lastSeen: Date.now()
        };
        state.users['bot0'].followers.push(id);
        state.users['bot1'].followers.push(id);
        saveState(); broadcast('user');
        setMeId(id); enterApp(name);
      };
      $('goLog').onclick = () => { mode = 'login'; drawForm(); };
    }
  }
}

window.toggleEye = (inputId, btn) => {
  const p = $(inputId); if (!p) return;
  if (p.type === 'password') { p.type = 'text'; btn.textContent = '🙈'; }
  else { p.type = 'password'; btn.textContent = '👁️'; }
};

function enterApp(name){
  toast('Selamat datang, ' + name + '! 🎉');
  view = { screen:'feed', profileId:null, chatWith:null, groupId:null, feedTab:'all' };
  render();
  setInterval(() => {
    const id = getMeId(); if (!id || !state.users[id]) return;
    state.users[id].lastSeen = Date.now(); saveState();
  }, 15000);
}

/* ============================================================
   RENDER UTAMA
============================================================ */
function render(){
  seed();
  applyTheme();
  if (!getMeId() || !state.users[getMeId()]) { renderAuth(); return; }
  const id = getMeId();
  state.users[id].lastSeen = Date.now();
  saveState();

  const app = $('app'); app.innerHTML = '';

  const hdr = document.createElement('div');
  hdr.className = 'header';
  const unN = unreadNotifs(id);
  const unC = totalUnreadChats();
  const isDark = state.theme === 'dark';
  hdr.innerHTML = `
    <div style="flex:1">
      <div class="logo">Temu Kawan${me().isFounder?' 👑':''}</div>
      <div class="logo-sub">Menyapa Bebual Bersama</div>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" title="Ganti tema">${isDark?'☀️':'🌙'}</button>
    <button class="icon-btn" onclick="go('notif')">🔔${unN?`<span class="badge">${unN>9?'9+':unN}</span>`:''}</button>
    ${avatarHtml(me(), '')}
  `;
  const av = hdr.querySelector('.avatar');
  if (av) av.onclick = () => go('profile');
  app.appendChild(hdr);

  const body = document.createElement('div');
  body.id = 'pageBody';
  app.appendChild(body);

  if (view.screen === 'feed') renderFeed(body);
  else if (view.screen === 'search') renderSearch(body);
  else if (view.screen === 'chat') renderChatList(body);
  else if (view.screen === 'chatroom') renderChatRoom(body);
  else if (view.screen === 'groups') renderGroupsList(body);
  else if (view.screen === 'groupchat') renderGroupChat(body);
  else if (view.screen === 'profile') renderProfile(body, getMeId(), true);

  else if (view.screen === 'verifikasi') renderVerifikasi(body);
  else if (view.screen === 'kelolauser') renderKelolaUser(body);
  else if (view.screen === 'statistik') renderStatistik(body);
  else if (view.screen === 'pusatakun') renderPusatAkun(body);
  else if (view.screen === 'keamanan') renderKeamanan(body);

  nav.className = 'bottomnav';

  </div>`;
  document.querySelectorAll('.bottomnav').forEach(n=>n.remove());
  document.body.appendChild(nav);

  if (view.screen !== 'profile') {
    const footer = document.createElement('div');
    footer.className = 'footer-copy';
    footer.innerHTML = `© 2025 <b>Shank Anggara From Ulumonggo</b><br>All Rights Reserved`;
    app.appendChild(footer);

}

function go(screen, opts = {}){
  Object.assign(view, opts, { screen });
  if (screen !== 'chatroom') view.chatWith = null;
  if (screen !== 'groupchat') view.groupId = null;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function totalUnreadChats(){
  const id = getMeId(); let n = 0;
  for (const k in state.chats){
    if (!k.includes(id)) continue;
    const msgs = state.chats[k] || [];
    const last = msgs[msgs.length-1];
    if (last && last.from !== id && !last.readBy?.[id]) n++;
  }
  return n;
}

function renderFeed(root){
  const sw = document.createElement('div');
  sw.className = 'stories';
  const ids = [getMeId(), ...me().following];
  ids.slice(0, 12).forEach(uid2 => {
    const u = user(uid2); if (!u) return;
    const hasS = (state.stories[uid2]||[]).filter(s => Date.now()-s.time < 86400000).length > 0;
    const isMe = uid2 === getMeId();
    const div = document.createElement('div');
    div.className = 'story-item';
    div.innerHTML = `<div class="story-ring ${hasS?'':'seen'}">${avatarHtml(u)}${isMe&&!hasS?'<div class="plus">+</div>':''}</div><div class="lbl">${isMe?'Kamu':esc(u.name.split(' ')[0])}</div>`;
    div.onclick = () => {
      if (isMe && !hasS) openStoryCreator();
      else if (hasS) openStoryViewer(uid2);
      else toast('Belum ada status');
    };
    sw.appendChild(div);
  });
  root.appendChild(sw);

  const trig = document.createElement('div');
  trig.className = 'ct';
  trig.innerHTML = `${avatarHtml(me(), 'sm')}<div class="fake">Apa yang kamu pikirkan, ${esc(me().name.split(' ')[0])}?</div><span style="font-size:20px">📷</span>`;

  tabs.className = 'tabs';
  tabs.innerHTML = `
    <button class="tab ${view.feedTab==='all'?'active':''}" onclick="view.feedTab='all';render()">🌏 Semua</button>
    <button class="tab ${view.feedTab==='following'?'active':''}" onclick="view.feedTab='following';render()">👥 Mengikuti</button>`;
  root.appendChild(tabs);

  let posts = [...state.posts].sort((a,b)=>b.time-a.time);
  if (view.feedTab === 'following') {
    const f = me().following || [];
    posts = posts.filter(p => f.includes(p.authorId) || p.authorId === getMeId());
  }
  if (!posts.length){
    root.innerHTML += `<div class="empty"><div class="big">📭</div><h4>Belum ada postingan</h4><p>Ikuti orang lain atau buat postingan pertamamu!</p></div>`;

function buildPost(p){
  const a = user(p.authorId); if (!a) return document.createElement('div');
  const isMine = p.authorId === getMeId();
  const liked = p.likes.includes(getMeId());
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="post-head">
      ${avatarHtml(a, isOnline(a.id)?'online':'')}
      <div class="info">
        <div class="name" onclick="go('userprofile',{profileId:'${a.id}'})">${nameWithBadge(a)}${a.isBot?'<span style="background:rgba(16,185,129,.15);color:var(--ok);font-size:9px;padding:1px 6px;border-radius:6px;font-weight:800;margin-left:3px">BOT</span>':''}</div>
        <div class="time">${timeAgo(p.time)}</div>
      </div>
      ${isMine||me().isAdmin ? `<button class="icon-btn" style="width:32px;height:32px;font-size:14px" onclick="deletePost('${p.id}')">🗑️</button>` : ''}
    </div>
    ${p.text ? `<div class="post-text">${esc(p.text)}</div>` : ''}
    ${p.image ? `<img class="post-img" src="${p.image}" loading="lazy" onclick="viewImage('${p.id}')">` : ''}
    <div class="post-actions">
      <button class="act ${liked?'liked':''}" onclick="toggleLike('${p.id}')"><span>${liked?'❤️':'🤍'}</span>${p.likes.length||''}</button>
      <button class="act" onclick="toggleComments('${p.id}')"><span>💬</span>${p.comments.length||''}</button>
      <button class="act" onclick="sharePost('${p.id}')"><span>🔗</span></button>
    </div>
    <div class="comments" id="c-${p.id}">
      ${p.comments.map(c => {
        const u = user(c.userId) || {name:'?',avatar:'❓'};
        return `<div class="cmt">${avatarHtml(u,'xs')}<div class="body"><b>${esc(u.name)}</b>${esc(c.text)}</div></div>`;
      }).join('')}
      <div class="cmt-input">
        ${avatarHtml(me(),'xs')}
        <input id="ci-${p.id}" placeholder="Tulis komentar..." maxlength="150" onkeydown="if(event.key==='Enter')addComment('${p.id}')">
        <button onclick="addComment('${p.id}')">➤</button>
      </div>
    </div>`;
  return el;
}

function viewImage(postId){
  const p = state.posts.find(x=>x.id===postId);
  if (!p || !p.image) return;
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  m.innerHTML = `<img src="${p.image}" style="max-width:100%;max-height:100%;border-radius:16px;object-fit:contain"><button style="position:absolute;top:20px;right:20px;width:44px;height:44px;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;font-size:24px;border:none;cursor:pointer" onclick="this.parentElement.remove()">✕</button>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
}

function toggleLike(id){
  const p = state.posts.find(x => x.id === id); if (!p) return;
  const meId = getMeId();
  const i = p.likes.indexOf(meId);
  if (i >= 0) p.likes.splice(i, 1);
  else { p.likes.push(meId); if (p.authorId !== meId) pushNotif(p.authorId, 'like', { by: meId, postId: p.id }); }
  saveState(); broadcast('post'); render();
}
function toggleComments(id){ $('c-'+id)?.classList.toggle('open'); }
function addComment(id){
  const inp = $('ci-' + id); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const p = state.posts.find(x => x.id === id); if (!p) return;
  p.comments.push({ userId: getMeId(), text, time: Date.now() });
  if (p.authorId !== getMeId()) pushNotif(p.authorId, 'comment', { by: getMeId(), postId: p.id, text });
  inp.value = ''; saveState(); broadcast('post'); render();
  setTimeout(() => $('c-'+id)?.classList.add('open'), 30);
}
function deletePost(id){
  if (!confirm('Hapus postingan ini?')) return;
  state.posts = state.posts.filter(x => x.id !== id);
  saveState(); broadcast('post'); render(); toast('Postingan dihapus');
}
function sharePost(id){
  const p = state.posts.find(x => x.id === id); if (!p) return;
  const txt = (p.text || '[Foto]') + ' — dari Temu Kawan Pro';
  if (navigator.share) navigator.share({ title:'Temu Kawan Pro', text: txt }).catch(()=>{});
  else { navigator.clipboard?.writeText(txt); toast('Teks dicopy 📋'); }
}

============================================================ */
function openCompose(){
  pendingImage = null;
  const m = document.createElement('div');
  m.className = 'modal-bg open'; m.id = 'composeModal';
  m.innerHTML = `<div class="modal">
    <h3>✍️ Buat Postingan</h3>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;">${avatarHtml(me(),'sm')}<div style="font-weight:700">${esc(me().name)}</div></div>
    <textarea class="field" id="compText" placeholder="Apa yang kamu pikirkan?" maxlength="500" style="min-height:100px;resize:none;font-family:inherit;"></textarea>
    <div class="img-prev" id="imgPrev"><img id="imgPrevEl"><button onclick="removeComposeImage()">✕</button></div>
    <button class="mini-btn" style="width:100%;padding:11px;margin-bottom:14px;" onclick="document.getElementById('compFile').click()">📷 Tambah Foto</button>
    <input type="file" id="compFile" accept="image/*" style="display:none">
    <button class="btn" id="compPost" disabled>Posting</button>
    <button class="btn sec" onclick="closeCompose()" style="margin-top:8px;">Batal</button>
  </div>`;
  m.onclick = e => { if (e.target === m) closeCompose(); };
  document.body.appendChild(m);
  const text = $('compText'), btn = $('compPost');
  text.addEventListener('input', () => { btn.disabled = !text.value.trim() && !pendingImage; });
  text.focus();
  $('compFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { pendingImage = await resizeImg(f); $('imgPrevEl').src = pendingImage; $('imgPrev').classList.add('show'); btn.disabled = false; }
    catch { toast('Gagal memuat gambar'); }
  };
  btn.onclick = () => {
    const t = text.value.trim();
    if (!t && !pendingImage) return;
    state.posts.unshift({ id: uid('p'), authorId: getMeId(), text: t, image: pendingImage, likes: [], comments: [], time: Date.now() });
    saveState(); broadcast('post'); closeCompose(); go('feed');
    toast('Postingan dibuat! 🎉');
  };
}
function removeComposeImage(){
  pendingImage = null; $('imgPrev').classList.remove('show');
  const t = $('compText'); $('compPost').disabled = !t.value.trim();
}
function closeCompose(){ $('composeModal')?.remove(); pendingImage = null; }

function openStoryViewer(userId){
  const list = (state.stories[userId]||[]).filter(s => Date.now()-s.time < 86400000).sort((a,b)=>a.time-b.time);
  if (!list.length) return;
  let idx = 0;
  const u = user(userId);
  const v = document.createElement('div');
  v.id = 'storyView';
  v.style.cssText = 'position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff';
  document.body.appendChild(v);
  function draw(){
    const s = list[idx];
    if (!s.seenBy) s.seenBy = [];
    if (!s.seenBy.includes(getMeId())) s.seenBy.push(getMeId());
    saveState();
    v.innerHTML = `<div style="position:absolute;top:20px;left:20px;right:20px;display:flex;gap:10px;align-items:center">${avatarHtml(u,'sm')}<div><div style="font-weight:800">${esc(u.name)}</div><div style="font-size:11px;opacity:.7">${timeAgo(s.time)}</div></div></div><button style="position:absolute;top:20px;right:20px;color:#fff;font-size:26px;background:none;border:none;cursor:pointer" onclick="closeStory()">✕</button><div style="font-size:120px" onclick="nextStory()">${s.emoji}</div>${s.text ? `<div style="position:absolute;bottom:80px;left:20px;right:20px;text-align:center;font-size:18px;font-weight:600;padding:16px;background:rgba(0,0,0,.4);border-radius:16px">${esc(s.text)}</div>` : ''}`;
    clearTimeout(window._storyTimer);
    window._storyTimer = setTimeout(() => nextStory(), 5000);
  }
  window.nextStory = () => { if (idx < list.length-1) { idx++; draw(); } else closeStory(); };
  window.closeStory = () => { clearTimeout(window._storyTimer); v.remove(); render(); };
  draw();
}

function renderSearch(root){

/* ============================================================
   FOLLOW
============================================================ */
function toggleFollow(userId){
  if (userId === getMeId()) return;
  const u = user(userId); if (!u) return;
  const meU = me();
  const i = meU.following.indexOf(userId);
  if (i >= 0) {
    meU.following.splice(i, 1);
    u.followers = u.followers.filter(x => x !== getMeId());
    toast(`Batal ikuti ${u.name}`);
  } else {
    meU.following.push(userId);
    if (!u.followers.includes(getMeId())) u.followers.push(getMeId());
    pushNotif(userId, 'follow', { by: getMeId() });
    toast(`Mengikuti ${u.name} ✅`);
    if (u.isBot && !u.following.includes(getMeId())) {
      setTimeout(() => {
        u.following.push(getMeId());
        if (!meU.followers.includes(u.id)) meU.followers.push(u.id);
        pushNotif(getMeId(), 'follow', { by: u.id });
        saveState(); broadcast('follow');
      }, 1500 + Math.random()*1500);
    }
  }
  saveState(); broadcast('follow'); render();
}

      pendingProfilePic = await resizeImg(f, 400, 0.8);
      $('picPreview').innerHTML = `<img src="${pendingProfilePic}">`;
      m.querySelectorAll('#epGrid button').forEach(x=>x.classList.remove('sel'));
    } catch { toast('Gagal memuat foto'); }
  };
  $('epGrid').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    m.querySelectorAll('#epGrid button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); picked = b.dataset.e; pendingProfilePic = null;
    $('picPreview').innerHTML = picked;
  };
  $('epSave').onclick = () => {
    me().name = $('epName').value.trim() || me().name;
    me().bio = $('epBio').value.trim();
    if (pendingProfilePic) me().avatarPic = pendingProfilePic;
    else if (picked) { me().avatar = picked; me().avatarPic = null; }
    saveState(); broadcast('user'); m.remove(); render();
    toast('Profil diperbarui ✅');
  };
  window.removeProfilePic = () => {
    pendingProfilePic = null; me().avatarPic = null;
    $('picPreview').innerHTML = me().avatar;
    toast('Foto profil dihapus');
  };
}

function renderVerifikasi(root){
  if (!me().isFounder && !me().isAdmin) { root.innerHTML = '<div class="empty"><div class="big">⛔</div><p>Akses khusus Founder</p></div>'; return; }
  const pending = state.verifikasi.filter(v => v.status === 'pending');
  const riwayat = state.verifikasi.filter(v => v.status !== 'pending').slice(0, 10);
  const h = document.createElement('div');
  h.className = 'section-title';
  h.innerHTML = `📥 Pengajuan Verifikasi <span class="num">${pending.length}</span>`;
  root.appendChild(h);
  if (!pending.length) {
    root.innerHTML += `<div class="empty" style="padding:30px"><div class="big">📭</div><h4>Tidak ada pengajuan</h4><p>Semua sudah direview</p></div>`;
  } else {
    pending.forEach(v => {
      const u = user(v.userId); if (!u) return;
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">${avatarHtml(u,'sm')}<div style="flex:1"><div style="font-weight:800;font-size:14px">${esc(u.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(u.email||'')} • ${timeAgo(v.waktu)}</div></div></div><div style="background:rgba(255,107,53,.06);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;margin-bottom:10px"><b style="color:var(--p1)">📝 Nama:</b> ${esc(v.nama)}<br><b style="color:var(--p1)">💬 Alasan:</b> ${esc(v.alasan)}</div><div style="display:flex;gap:8px"><button class="btn" style="flex:1;background:linear-gradient(135deg,#10b981,#059669);box-shadow:none;padding:10px" onclick="approveVerifikasi('${v.id}')">✓ Setujui</button><button class="btn" style="flex:1;background:rgba(239,68,68,.15);color:var(--err);box-shadow:none;padding:10px" onclick="rejectVerifikasi('${v.id}')">✕ Tolak</button></div>`;
      root.appendChild(div);
    });
  }
  if (riwayat.length) {
    const rh = document.createElement('div');
    rh.className = 'section-title';
    rh.style.marginTop = '20px';
    rh.innerHTML = `📜 Riwayat`;
    root.appendChild(rh);
    riwayat.forEach(v => {
      const u = user(v.userId); if (!u) return;
      const div = document.createElement('div');
      div.className = 'user-row';
      div.innerHTML = `${avatarHtml(u,'xs')}<div class="info"><div class="name">${esc(u.name)}</div><div class="bio" style="color:${v.status==='approved'?'var(--ok)':'var(--err)'}">${v.status==='approved'?'✅ Disetujui':'❌ Ditolak'} • ${timeAgo(v.waktu)}</div></div>`;
      root.appendChild(div);
    });
  }
}

function approveVerifikasi(id){
  const v = state.verifikasi.find(x=>x.id===id); if (!v) return;
  v.status = 'approved'; v.diprosesAt = Date.now();
  const u = state.users[v.userId];
  if (u) { u.verified = true; pushNotif(u.id, 'verified', { by: FOUNDER.id, text: 'Akun Anda telah diverifikasi! ✓' }); }
  saveState(); broadcast('verifikasi'); toast('✅ User diverifikasi!'); render();
}
function rejectVerifikasi(id){
  if (!confirm('Tolak pengajuan ini?')) return;
  const v = state.verifikasi.find(x=>x.id===id); if (!v) return;
  v.status = 'rejected'; v.diprosesAt = Date.now();
  const u = state.users[v.userId];
  if (u) pushNotif(u.id, 'rejected', { by: FOUNDER.id, text: 'Pengajuan verifikasi ditolak' });
  saveState(); broadcast('verifikasi'); toast('Pengajuan ditolak'); render();
}

}

function adminDeleteUser(id){
  if (id === getMeId()) return toast('Tidak bisa hapus diri sendiri');
  if (id === FOUNDER.id) return toast('Founder tidak bisa dihapus');
  const u = state.users[id]; if (!u) return;
  if (!confirm(`Hapus user "${u.name}"?`)) return;
  delete state.users[id];
  state.posts = state.posts.filter(p => p.authorId !== id);
  Object.keys(state.chats).forEach(k => { if (k.includes(id)) delete state.chats[k]; });
  Object.values(state.users).forEach(x => {
    x.following = x.following.filter(f => f !== id);
    x.followers = x.followers.filter(f => f !== id);
  });
  saveState(); broadcast('user'); toast('User dihapus'); render();
}

/* ============================================================
   STATISTIK (Founder)
============================================================ */
function renderStatistik(root){
  if (!me().isFounder && !me().isAdmin) { root.innerHTML = '<div class="empty"><div class="big">⛔</div><p>Akses khusus Founder</p></div>'; return; }
  const users = Object.values(state.users);
  const realUsers = users.filter(u => !u.isBot);
  const bots = users.filter(u => u.isBot);
  const totalMsgs = Object.values(state.chats).reduce((a,c) => a+c.length, 0) + Object.values(state.groups).reduce((a,g) => a+g.messages.length, 0);
  const h = document.createElement('div');
  h.className = 'section-title';
  h.innerHTML = `📊 Statistik Aplikasi`;
  root.appendChild(h);
  const grid = document.createElement('div');
  grid.className = 'admin-grid';
  grid.innerHTML = `<div class="admin-stat"><div class="n">${realUsers.length}</div><div class="l">User Asli</div></div><div class="admin-stat"><div class="n">${bots.length}</div><div class="l">Bot</div></div><div class="admin-stat"><div class="n">${state.posts.length}</div><div class="l">Postingan</div></div><div class="admin-stat"><div class="n">${totalMsgs}</div><div class="l">Pesan</div></div><div class="admin-stat"><div class="n">${Object.keys(state.groups).length}</div><div class="l">Grup</div></div><div class="admin-stat"><div class="n">${state.verifikasi.filter(v=>v.status==='approved').length}</div><div class="l">Terverifikasi</div></div>`;
  root.appendChild(grid);
  const dz = document.createElement('div');
  dz.style.marginTop = '20px';
  dz.innerHTML = `<button class="btn" style="background:#ef4444;box-shadow:none" onclick="adminClearAll()">🗑️ Hapus Semua Postingan</button><button class="btn sec" style="margin-top:8px" onclick="adminExport()">📥 Export Data (JSON)</button>`;
  root.appendChild(dz);
}

function adminClearAll(){
  if (!confirm('Hapus SEMUA postingan? Tidak bisa dibatalkan!')) return;
  state.posts = [];
  saveState(); broadcast('post'); toast('Semua postingan dihapus'); render();
}
function adminExport(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'temu-kawan-data-' + Date.now() + '.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Data diexport 📥');
}

/* ============================================================
   NOTIFIKASI
============================================================ */
function renderNotif(root){
  const list = state.notifications[getMeId()] || [];
  list.forEach(n => n.read = true);
  saveState();
  const h = document.createElement('div');
  h.className = 'section-title';
  h.innerHTML = `🔔 Notifikasi`;
  root.appendChild(h);
  if (!list.length) { root.innerHTML += `<div class="empty"><div class="big">🔕</div><h4>Belum ada notifikasi</h4><p>Aktivitas akan muncul di sini</p></div>`; return; }
  list.forEach(n => {
    const u = user(n.by); if (!u) return;
    const div = document.createElement('div');
    div.className = 'notif';
    let text = '';
    if (n.type === 'like') text = `<b>${esc(u.name)}</b> menyukai postinganmu`;
    else if (n.type === 'comment') text = `<b>${esc(u.name)}</b> berkomentar: "${esc(n.text||'').slice(0,40)}"`;
    else if (n.type === 'follow') text = `<b>${esc(u.name)}</b> mulai mengikuti kamu`;
    else if (n.type === 'post') text = `<b>${esc(u.name)}</b> membuat postingan baru`;
    else if (n.type === 'message') text = `<b>${esc(u.name)}</b> mengirim pesan`;
    else if (n.type === 'verifikasi') text = `<b>${esc(u.name)}</b> mengajukan verifikasi akun`;
    else if (n.type === 'verified') text = `✅ Akun Anda telah diverifikasi!`;
    else if (n.type === 'rejected') text = `❌ Pengajuan verifikasi Anda ditolak`;
    div.innerHTML = `${avatarHtml(u,'sm')}<div class="body">${text}<div class="t">${timeAgo(n.time)}</div></div>`;
    div.onclick = () => {
      if (n.type === 'verifikasi') go('verifikasi');
      else if (n.type === 'follow' || n.type === 'verified' || n.type === 'rejected') go('userprofile', { profileId: u.id });
      else if (n.type === 'message') go('chatroom', { chatWith: u.id });
      else go('feed');
    };
    root.appendChild(div);
  });
}

/* ============================================================
   CHAT
============================================================ */
function renderChatList(root){
  const meId = getMeId();
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  tabs.innerHTML = `<button class="tab active">💬 Personal</button><button class="tab" onclick="go('groups')">👥 Grup</button>`;
  root.appendChild(tabs);
  const ids = new Set([...me().following, ...me().followers]);
  const users = [...ids].map(id => user(id)).filter(Boolean);
  users.sort((a,b) => {
    const ka = chatKey(meId, a.id), kb = chatKey(meId, b.id);
    return (state.chats[kb]?.slice(-1)[0]?.time||0) - (state.chats[ka]?.slice(-1)[0]?.time||0);
  });
  if (!users.length) { root.innerHTML += `<div class="empty"><div class="big">💬</div><h4>Belum ada chat</h4><p>Ikuti seseorang di tab Cari untuk mulai ngobrol</p></div>`; return; }
  users.forEach(u => {
    const key = chatKey(meId, u.id);
    const msgs = state.chats[key] || [];
    const last = msgs[msgs.length-1];
    const unread = last && last.from !== meId && !(last.readBy||{})[meId];
    const row = document.createElement('div');
    row.className = 'user-row';
    let preview = 'Mulai percakapan...';
    if (last) {
      if (last.type === 'image') preview = '📷 Foto';
      else if (last.type === 'audio') preview = '🎤 Voice Note';
      else preview = (last.from===meId?'Kamu: ':'') + esc((last.text||'').slice(0,35));
    }
    row.innerHTML = `${avatarHtml(u, isOnline(u.id)?'online':'')}<div class="info"><div class="name">${nameWithBadge(u)}</div><div class="bio">${preview}</div></div><div style="text-align:right;"><div style="font-size:11px;color:var(--muted)">${last?timeAgo(last.time):''}</div>${unread?'<div class="chat-badge">Baru</div>':''}</div>`;
    row.onclick = () => go('chatroom', { chatWith: u.id });
    root.appendChild(row);
  });
}
function openChatWith(userId){ go('chatroom', { chatWith: userId }); }

function renderChatRoom(root){
  const meId = getMeId();
  const u = user(view.chatWith); if (!u) { go('chat'); return; }
  const key = chatKey(meId, u.id);
  const msgs = state.chats[key] || [];
  msgs.forEach(m => { if (!m.readBy) m.readBy = {}; m.readBy[meId] = true; });
  saveState();
  const hdr = document.createElement('div');
  hdr.className = 'chat-header';
  hdr.innerHTML = `<button class="back-btn" onclick="go('chat')">←</button>${avatarHtml(u, isOnline(u.id)?'online':'')}<div style="flex:1"><div class="name">${nameWithBadge(u)}</div><div class="sub"><span class="dot ${isOnline(u.id)?'on':''}"></span>${isOnline(u.id)?'Online':'Terakhir '+timeAgo(u.lastSeen||u.joinedAt)}</div></div>`;
  hdr.querySelector('.avatar').onclick = () => go('userprofile', { profileId: u.id });
  root.appendChild(hdr);
  const body = document.createElement('div');
  body.className = 'chat-body'; body.id = 'chatBody';
  if (!msgs.length) {
    body.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:13px;padding:30px">👋 Mulai percakapan dengan <b style="color:var(--p1)">${esc(u.name)}</b></div>`;
  } else {
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'bubble ' + (m.from === meId ? 'me' : 'them');
      let content = '';
      if (m.type === 'image') content = `<img src="${m.image}" alt="foto">`;
      else if (m.type === 'audio') content = `<audio controls src="${m.audio}"></audio>`;
      content += esc(m.text || '');
      const seen = m.from === meId && m.readBy?.[u.id];
      div.innerHTML = `${content}<span class="t">${timeFull(m.time)}${m.from===meId?`<span class="seen">${seen?'✓✓':'✓'}</span>`:''}</span>`;
      body.appendChild(div);
    });
  }
  root.appendChild(body);
  const row = document.createElement('div');
  row.className = 'chat-input-row';
  row.innerHTML = `<button class="sm-btn" onclick="document.getElementById('chatImg').click()">📷</button><input type="file" id="chatImg" accept="image/*" style="display:none"><input id="chatInput" placeholder="Ketik pesan..." maxlength="300" autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()"><button class="sm-btn" id="micBtn" onclick="toggleRecord()">🎤</button><button class="send" onclick="sendMessage()">➤</button>`;
  root.appendChild(row);
  $('chatImg').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const img = await resizeImg(f, 900, 0.75); sendMsg({ type:'image', image: img, text:'' }); }
    catch { toast('Gagal kirim gambar'); }
  };
  setTimeout(() => { body.scrollTop = body.scrollHeight; }, 40);
}

function sendMessage(){
  const inp = $('chatInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  sendMsg({ text }); inp.value = '';
}

function sendMsg(msgObj){
  const meId = getMeId();
  const u = user(view.chatWith); if (!u) return;
  const key = chatKey(meId, u.id);
  if (!state.chats[key]) state.chats[key] = [];
  state.chats[key].push({ from: meId, ...msgObj, time: Date.now(), readBy: { [meId]: true } });
  saveState(); broadcast('chat');
  renderChatRoom($('pageBody'));
  pushNotif(u.id, 'message', { by: meId });
  saveState();
  if (u.isBot) {
    setTimeout(() => {
      const reply = BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];
      state.chats[key].push({ from: u.id, text: reply, time: Date.now(), readBy: { [u.id]: true } });
      u.lastSeen = Date.now();
      saveState(); broadcast('chat');
      if (view.screen === 'chatroom' && view.chatWith === u.id) { renderChatRoom($('pageBody')); playSound(); }
    }, 1200 + Math.random()*1200);
  }
}

async function toggleRecord(){
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordingTimer);
      $('recOverlay')?.remove();
      const blob = new Blob(audioChunks, { type:'audio/webm' });
      if (blob.size < 500) { toast('Rekaman terlalu pendek'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const audio = reader.result;
        if (audio.length > 900000) { toast('Rekaman terlalu panjang'); return; }
        sendMsg({ type:'audio', audio, text:'' });
      };
      reader.readAsDataURL(blob);
      const btn = $('micBtn'); if (btn) btn.classList.remove('rec');
    };
    mediaRecorder.start();
    recordingStart = Date.now();
    const btn = $('micBtn'); if (btn) btn.classList.add('rec');
    const ov = document.createElement('div');
    ov.id = 'recOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:20px';
    ov.innerHTML = `<div style="font-size:80px;animation:recPulse 1s infinite">🎤</div><div id="recTimer" style="font-size:32px;font-weight:800;font-variant-numeric:tabular-nums">0:00</div><div style="font-size:13px;opacity:.7">Merekam voice note... (maks 60 dtk)</div><button style="background:var(--err);color:#fff;padding:16px 40px;border-radius:40px;font-weight:800;font-size:16px;border:none;cursor:pointer" onclick="toggleRecord()">⏹ Stop & Kirim</button>`;
    document.body.appendChild(ov);
    recordingTimer = setInterval(() => {
      const s = Math.floor((Date.now() - recordingStart)/1000);
      const t = $('recTimer'); if (t) t.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
      if (s >= 60) toggleRecord();
    }, 200);
  } catch (e) { toast('❌ Tidak bisa akses mikrofon'); }
}

/* ============================================================
   GRUP
============================================================ */
function renderGroupsList(root){
  const meId = getMeId();
  const h = document.createElement('div');
  h.className = 'section-title';
  h.innerHTML = `👥 Grup Saya`;
  root.appendChild(h);
  const groups = Object.values(state.groups).filter(g => g.members.includes(meId));
  const createBtn = document.createElement('button');
  createBtn.className = 'btn';
  createBtn.style.marginBottom = '14px';
  createBtn.textContent = '➕ Buat Grup Baru';
  createBtn.onclick = openCreateGroup;
  root.appendChild(createBtn);
  if (!groups.length) { root.innerHTML += `<div class="empty"><div class="big">👥</div><h4>Belum ada grup</h4><p>Buat grup untuk ngobrol bareng teman-temanmu</p></div>`; return; }
  groups.forEach(g => {
    const div = document.createElement('div');
    div.className = 'group-item';
    const last = g.messages[g.messages.length-1];
    div.innerHTML = `<div class="gic">${g.emoji || '👥'}</div><div class="info"><div class="name">${esc(g.name)}</div><div class="sub">${g.members.length} anggota${last?` • ${esc((last.text||'[Media]').slice(0,25))}`:''}</div></div>`;
    div.onclick = () => go('groupchat', { groupId: g.id });
    root.appendChild(div);
  });
}

function openCreateGroup(){
  let emoji = '👥';
  let selectedMembers = [];
  const friendIds = [...new Set([...me().following, ...me().followers])].map(id => user(id)).filter(u => u && u.id !== getMeId());
  const m = document.createElement('div');
  m.className = 'modal-bg open';
  m.innerHTML = `<div class="modal"><h3>➕ Buat Grup Baru</h3><input class="field" id="gName" placeholder="Nama grup" maxlength="30"><label>Emoji</label><div class="emoji-pick" id="gEmoji">${['👥','🌟','🔥','🎮','📚','🎵','⚽','🍕','💼','🎨','🐱','🌸'].map((e,i)=>`<button data-e="${e}" class="${i===0?'sel':''}">${e}</button>`).join('')}</div><label>Pilih anggota (${friendIds.length} tersedia)</label><div id="gMembers" style="max-height:200px;overflow-y:auto;margin-bottom:14px;">${friendIds.length === 0 ? '<p style="color:var(--muted);font-size:13px;padding:10px">Belum ada teman.</p>' : friendIds.map(u => `<div class="user-row" data-id="${u.id}" style="margin-bottom:6px">${avatarHtml(u,'sm')}<div class="info"><div class="name">${esc(u.name)}</div><div class="bio">${esc(u.bio||'')}</div></div><div class="chk" style="width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0">✓</div></div>`).join('')}</div><button class="btn" id="gCreate">Buat Grup</button><button class="btn sec" onclick="this.closest('.modal-bg').remove()" style="margin-top:8px">Batal</button></div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
  $('gEmoji').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    $('gEmoji').querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); emoji = b.dataset.e;
  };
  $('gMembers').onclick = e => {
    const row = e.target.closest('.user-row'); if (!row) return;
    const chk = row.querySelector('.chk');
    const id = row.dataset.id;
    const i = selectedMembers.indexOf(id);
    if (i >= 0) { selectedMembers.splice(i,1); chk.style.background=''; chk.style.color=''; }
    else { selectedMembers.push(id); chk.style.background='var(--p1)'; chk.style.color='#fff'; }
  };
  $('gCreate').onclick = () => {
    const name = $('gName').value.trim();
    if (!name) return toast('Isi nama grup');
    if (!selectedMembers.length) return toast('Pilih minimal 1 anggota');
    const gid = uid('g_');
    state.groups[gid] = { id: gid, name, emoji, members: [getMeId(), ...selectedMembers], admins: [getMeId()], createdBy: getMeId(), createdAt: Date.now(), messages: [{ id: uid('gm'), from: getMeId(), text:`Grup "${name}" dibuat`, time: Date.now(), system:true }] };
    saveState(); broadcast('group'); m.remove();
    toast('Grup dibuat! 🎉'); go('groupchat', { groupId: gid });
  };
}

function renderGroupChat(root){
  const meId = getMeId();
  const g = state.groups[view.groupId]; if (!g) { go('groups'); return; }
  const hdr = document.createElement('div');
  hdr.className = 'chat-header';
  hdr.innerHTML = `<button class="back-btn" onclick="go('groups')">←</button><div class="gic" style="width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px">${g.emoji||'👥'}</div><div style="flex:1"><div class="name">${esc(g.name)}</div><div class="sub">${g.members.length} anggota</div></div>`;
  root.appendChild(hdr);
  const body = document.createElement('div');
  body.className = 'chat-body'; body.id = 'chatBody';
  g.messages.forEach(m => {
    const div = document.createElement('div');
    if (m.system) {
      div.style.cssText = 'text-align:center;font-size:12px;color:var(--muted);padding:6px;';
      const u = user(m.from) || { name:'?' };
      div.textContent = `${u.name} ${m.text}`;
    } else {
      const isMe = m.from === meId;
      const u = user(m.from) || { name:'?', avatar:'❓' };
      div.className = 'bubble ' + (isMe?'me':'them');
      let content = '';
      if (!isMe) content += `<div style="font-size:11px;font-weight:700;color:var(--p1);margin-bottom:4px">${esc(u.name)}</div>`;
      if (m.type === 'image') content += `<img src="${m.image}">`;
      else if (m.type === 'audio') content += `<audio controls src="${m.audio}"></audio>`;
      content += esc(m.text||'');
      content += `<span class="t">${timeFull(m.time)}</span>`;
      div.innerHTML = content;
    }
    body.appendChild(div);
  });
  root.appendChild(body);
  const row = document.createElement('div');
  row.className = 'chat-input-row';
  row.innerHTML = `<button class="sm-btn" onclick="document.getElementById('grpImg').click()">📷</button><input type="file" id="grpImg" accept="image/*" style="display:none"><input id="chatInput" placeholder="Ketik pesan ke grup..." maxlength="300" autocomplete="off" onkeydown="if(event.key==='Enter')sendGroupMessage()"><button class="send" onclick="sendGroupMessage()">➤</button>`;
  root.appendChild(row);
  $('grpImg').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const img = await resizeImg(f, 900, 0.75);
      g.messages.push({ id: uid('gm'), from: meId, type:'image', image: img, time: Date.now() });
      saveState(); broadcast('group'); renderGroupChat($('pageBody'));
    } catch { toast('Gagal kirim gambar'); }
  };
  setTimeout(() => { body.scrollTop = body.scrollHeight; }, 40);
}

function sendGroupMessage(){
  const inp = $('chatInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const g = state.groups[view.groupId]; if (!g) return;
  g.messages.push({ id: uid('gm'), from: getMeId(), text, time: Date.now() });
  inp.value = '';
  saveState(); broadcast('group');
  renderGroupChat($('pageBody'));
  const bots = g.members.filter(mid => state.users[mid]?.isBot);
  if (bots.length) {
    const botId = bots[Math.floor(Math.random()*bots.length)];
    setTimeout(() => {
      const reply = BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];
      g.messages.push({ id: uid('gm'), from: botId, text: reply, time: Date.now() });
      saveState(); broadcast('group');
      if (view.screen === 'groupchat' && view.groupId === g.id) { renderGroupChat($('pageBody')); playSound(); }
    }, 1200 + Math.random()*1500);
  }
}

   INIT

state = loadState();
seed();
applyTheme();
render();

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { state = loadState(); render(); }
});

setInterval(() => {
  if (getMeId() && ['feed','chat','profile'].includes(view.screen)) {
    state = loadState();
    render();
  }
}, 30000);
